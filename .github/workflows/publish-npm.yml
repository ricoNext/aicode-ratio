# 在 npmjs.com 创建 Automation / Granular access token（见 README 或下方注释），
# 在仓库 Settings → Secrets and variables → Actions 中添加 NPM_TOKEN，再推送与 package.json 版本一致的 tag：
#   git tag v0.1.0 && git push origin v0.1.0
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本与 package.json 的 packageManager（pnpm@x.y.z）一致，勿在此再写 version，否则会与 action-setup 冲突
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
